<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GestãoFácil — Iniciando</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="phone-frame phone-frame--splash">

    <div class="status-bar status-bar--light">
      <span>9:41</span>
      <div class="status-bar__right">
        <span>5G</span>
        <span>100%</span>
      </div>
    </div>

    <main class="splash-center">
      <img src="logo.svg" alt="Gestão Fácil" class="splash-center__logo" />
    </main>

    <footer class="splash-footer">
      <div class="progress-track progress-track--light">
        <div class="progress-fill"></div>
      </div>
      <div class="sync-badge sync-badge--light">
        <span class="sync-badge__dot"></span>
      
      </div>
    </footer>

  </div>

  <script>
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 8800);
  </script>

</body>
</html>
